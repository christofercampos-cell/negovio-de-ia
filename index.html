<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Meu Site</h1>
        <p>Um lugar para compartilhar imagens e informações.</p>
    </header>

    <main>

        <section class="banner">
            <img src="https://images.unsplash.com/photo-1516483638261-f4dbaf036963?auto=format&fit=crop&w=1200&q=80" alt="Paisagem da Itália">
        </section>

        <section class="conteudo">

            <div class="card">
                <img src="https://images.unsplash.com/photo-1525874684015-58379d421a52?auto=format&fit=crop&w=600&q=80" alt="Coliseu em Roma">

                <h2>Itália</h2>
                <p>
                    A Itália é conhecida por sua rica história, culinária e belas paisagens.
                </p>

                <button id="likeBtn">❤️ Curtir</button>
                <p>Curtidas: <span id="likes">0</span></p>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1531572753322-ad063cecc140?auto=format&fit=crop&w=600&q=80" alt="Veneza">

                <h2>Veneza</h2>
                <p>
                    Veneza é famosa por seus canais, gôndolas e arquitetura histórica.
                </p>
            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 - Meu Site</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
